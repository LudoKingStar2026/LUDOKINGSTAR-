<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LudoKingStar</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6fb;
  color:#222;
}

.container{
  width:100%;
  max-width:480px;
  margin:0 auto;
  padding:20px;
}

h1,h2,h3{
  margin-bottom:15px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.hidden{
  display:none !important;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:8px 0 12px;
  font-size:16px;
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  margin-top:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:#2563eb;
  color:#fff;
}

button.secondary{
  background:#64748b;
}

button.success{
  background:#16a34a;
}

button.danger{
  background:#dc2626;
}

.small{
  font-size:13px;
  color:#777;
}

.msg{
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  background:#f1f5f9;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.header h2{
  margin:0;
}

.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.menu button{
  margin:0;
}

.balance{
  font-size:30px;
  font-weight:bold;
  margin:10px 0;
}

.game{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
  margin:10px 0;
}

.game b{
  font-size:17px;
}

/* =========================
   LUDO GAME
========================= */

.ludo-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.turn-box{
  background:#eef2ff;
  padding:10px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
}

.players{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin:12px 0;
}

.player{
  padding:8px 4px;
  border-radius:8px;
  text-align:center;
  font-size:12px;
  font-weight:bold;
  border:2px solid transparent;
}

.player.active{
  border-color:#111827;
  transform:scale(1.03);
}

.red{
  background:#fecaca;
}

.green{
  background:#bbf7d0;
}

.yellow{
  background:#fef08a;
}

.blue{
  background:#bfdbfe;
}

.ludo-board{
  width:100%;
  max-width:390px;
  aspect-ratio:1/1;
  margin:15px auto;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(6,1fr);
  border:4px solid #111827;
  background:#fff;
}

.cell{
  border:1px solid #cbd5e1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:bold;
  position:relative;
}

.cell.path{
  background:#fff;
}

.cell.red-home{
  background:#fecaca;
}

.cell.green-home{
  background:#bbf7d0;
}

.cell.yellow-home{
  background:#fef08a;
}

.cell.blue-home{
  background:#bfdbfe;
}

.cell.center{
  background:#e5e7eb;
}

.token{
  width:23px;
  height:23px;
  border-radius:50%;
  border:3px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.35);
}

.token.red-token{
  background:#ef4444;
}

.token.green-token{
  background:#22c55e;
}

.token.yellow-token{
  background:#eab308;
}

.token.blue-token{
  background:#3b82f6;
}

.dice-area{
  text-align:center;
  margin-top:10px;
}
