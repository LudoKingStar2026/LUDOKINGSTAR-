<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LudoKingStar User Panel</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#172033}.header{background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;padding:22px 18px;border-radius:0 0 24px 24px}.header h1{margin:0;font-size:25px}.header p{margin:7px 0 0;opacity:.9}.wrap{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 20px rgba(0,0,0,.07)}label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #d8dce8;border-radius:10px;font-size:16px}button{width:100%;border:0;border-radius:11px;padding:13px;font-size:16px;font-weight:700;background:#6d28d9;color:#fff;margin-top:14px}button.secondary{background:#eef2ff;color:#4c1d95}.hidden{display:none}.error{color:#b91c1c;margin-top:10px}.ok{color:#15803d;margin-top:10px}.wallet{font-size:30px;font-weight:800;color:#6d28d9}.row{display:flex;justify-content:space-between;gap:10px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#dcfce7;color:#166534;font-size:13px}.small{font-size:13px;color:#667085}.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu div{background:#f8fafc;border-radius:12px;padding:14px;text-align:center;font-weight:700}footer{text-align:center;color:#7b8190;font-size:12px;padding:18px}</style></head><body><div class="header"><div class="wrap"><h1>🎲 LudoKingStar</h1><p>User Panel</p></div></div><div class="wrap"><div id="loginCard" class="card"><h2>Login / Register</h2><p class="small">अपने 10 अंकों के मोबाइल नंबर से शुरू करें।</p><label>नाम</label><input id="name" placeholder="आपका नाम"><label>मोबाइल नंबर</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="10 digit mobile"><button onclick="requestOtp()">OTP भेजें</button><div id="msg"></div></div><div id="otpCard" class="card hidden"><h2>OTP Verification</h2><p class="small">Demo OTP: <b>123456</b></p><label>OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="123456"><button onclick="verifyOtp()">Verify & Login</button><button class="secondary" onclick="backToLogin()">वापस</button><div id="otpMsg"></div></div><div id="panel" class="hidden"><div class="card"><div class="row"><div><div class="small">Welcome</div><h2 id="userName" style="margin:5px 0"></h2><span class="badge">✓ Verified</span></div><div style="text-align:right"><div class="small">Wallet</div><div class="wallet">₹<span id="wallet">0</span></div></div></div></div><div class="card"><h3>My Account</h3><div class="menu"><div>👤 Profile</div><div>💰 Wallet</div><div>🎮 Games</div><div>📋 History</div></div></div><div class="card"><h3>Account Details</h3><p>Mobile: <b id="userMobile"></b></p><p>User ID: <span class="small" id="userId"></span></p><button class="secondary" onclick="logout()">Logout</button></div></div></div><footer>LudoKingStar User Panel • Demo</footer><script>const API="https://ludokingstar-ludokingstar-backend-2026.onrender.com";let currentMobile="";function setMsg(id,text,good=false){const e=document.getElementById(id);e.className=good?"ok":"error";e.textContent=text}async function requestOtp(){const name=document.getElementById("name").value.trim()||"Player",mobile=document.getElementById("mobile").value.replace(/\D/g,"");if(mobile.length!==10){setMsg("msg","कृपया 10 अंकों का मोबाइल नंबर डालें।");return}try{const r=await fetch(API+"/api/auth/request-otp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,mobile})}),d=await r.json();if(!r.ok)throw Error(d.error||"OTP request failed");currentMobile=mobile;document.getElementById("loginCard").classList.add("hidden");document.getElementById("otpCard").classList.remove("hidden");setMsg("otpMsg","OTP भेज दिया गया। Demo OTP: 123456",true)}catch(e){setMsg("msg","Backend connection error: "+e.message)}}async function verifyOtp(){const otp=document.getElementById("otp").value.trim();if(otp!=="123456"){setMsg("otpMsg","गलत OTP। Demo OTP 123456 है।");return}try{const r=await fetch(API+"/api/auth/verify-otp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mobile:currentMobile,otp})}),d=await r.json();if(!r.ok)throw Error(d.error||"Verification failed");document.getElementById("otpCard").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");document.getElementById("userName").textContent=d.user.name;document.getElementById("wallet").textContent=d.user.wallet;document.getElementById("userMobile").textContent=d.user.mobile;document.getElementById("userId").textContent=d.user.id}catch(e){setMsg("otpMsg","Login error: "+e.message)}}function backToLogin(){document.getElementById("otpCard").classList.add("hidden");document.getElementById("loginCard").classList.remove("hidden")}function logout(){currentMobile="";document.getElementById("panel").classList.add("hidden");document.getElementById("loginCard").classList.remove("hidden");document.getElementById("otp").value=""}</script></body></html>
