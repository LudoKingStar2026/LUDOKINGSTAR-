<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LudoKingStar Admin</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
}

header{
  background:#111827;
  color:white;
  padding:20px;
  font-size:24px;
  font-weight:bold;
}

.container{
  padding:20px;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

button{
  padding:12px 18px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.page{
  display:none;
  background:white;
  padding:20px;
  border-radius:10px;
}

.page.active{
  display:block;
}
</style>
</head>

<body>

<header>
🛡️ LudoKingStar Admin
</header>

<div class="container">

<div class="buttons">

<button onclick="openPage('dashboard')">
Dashboard
</button>

<button onclick="openPage('users')">
Users
</button>

<button onclick="openPage('transactions')">
Transactions
</button>

<button onclick="openPage('kyc')">
KYC
</button>

<button onclick="openPage('settings')">
Settings
</button>

</div>


<div id="dashboard" class="page active">
<h2>Dashboard</h2>
<p>✅ Dashboard working</p>
</div>


<div id="users" class="page">
<h2>Users</h2>
<p>Users section working</p>
</div>


<div id="transactions" class="page">
<h2>Transactions</h2>
<p>Transactions section working</p>
</div>


<div id="kyc" class="page">
<h2>KYC</h2>
<p>KYC section working</p>
</div>


<div id="settings" class="page">
<h2>Settings</h2>
<p>Settings section working</p>
</div>

</div>


<script>

function openPage(page){

document
.querySelectorAll(".page")
.forEach(function(item){

item.classList.remove("active");

});

document
.getElementById(page)
.classList.add("active");

}

</script>

</body>
</html>
