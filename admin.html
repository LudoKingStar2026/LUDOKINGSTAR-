<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LudoKingStar Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827
}
header{
  background:#111827;
  color:#fff;
  padding:18px;
  font-size:22px;
  font-weight:700
}
.container{
  max-width:1100px;
  margin:auto;
  padding:15px
}
nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px
}
button{
  border:0;
  border-radius:8px;
  padding:11px 15px;
  background:#2563eb;
  color:#fff;
  font-weight:700
}
nav button{background:#374151}
.card{
  background:#fff;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #0001
}
.section{display:none}
.section.active{display:block}
.setting{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #eee;
  gap:15px
}
input[type=number]{
  width:150px;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:7px
}
.switch{
  position:relative;
  width:52px;
  height:28px;
  display:inline-block
}
.switch input{display:none}
.slider{
  position:absolute;
  inset:0;
  background:#9ca3af;
  border-radius:30px
}
.slider:before{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s
}
.switch input:checked+.slider{
  background:#16a34a
}
.switch input:checked+.slider:before{
  transform:translateX(24px)
}
table{
  width:100%;
  border-collapse:collapse
}
th,td{
  padding:10px;
  border-bottom:1px solid #e5e7eb;
  text-align:left
}
th{background:#f9fafb}
.status{
  margin-top:12px;
  font-weight:700
}
@media(max-width:600px){
  th,td{
    font-size:12px;
    padding:7px
  }
  .setting{
    align-items:flex-start
  }
}
</style>
</head>

<body>

<header>🛡️ LudoKingStar Admin</header>

<div class="container">

<nav>
<button type="button" onclick="showSection('dashboard')">
Dashboard
</button>

<button type="button" onclick="showSection('users')">
Users
</button>

<button type="button" onclick="showSection('transactions')">
Transactions
</button>

<button type="button" onclick="showSection('kyc')">
KYC
</button>

<button type="button" onclick="showSection('settings')">
Settings
</button>

<button type="button" onclick="loadAll()">
🔄 Refresh
</button>
</nav>


<div id="dashboard" class="section active">

<div class="card">

<h2>Dashboard</h2>

<p>
Total Users:
<b id="userCount">0</b>
</p>

<p>
Total Transactions:
<b id="transactionCount">0</b>
</p>

<p>
KYC Records:
<b id="kycCount">0</b>
</p>

</div>

</div>


<div id="users" class="section">

<div class="card">

<h2>Users</h2>

<div style="overflow-x:auto">

<table>

<thead>

<tr>
<th>ID</th>
<th>Phone</th>
<th>Verified</th>
</tr>

</thead>

<tbody id="usersTable"></tbody>

</table>

</div>

</div>

</div>


<div id="transactions" class="section">

<div class="card">

<h2>Transactions</h2>

<div style="overflow-x:auto">

<table>

<thead>

<tr>
<th>ID</th>
<th>User</th>
<th>Type</th>
<th>Amount</th>
</tr>

</thead>

<tbody id="transactionsTable"></tbody>

</table>

</div>

</div>

</div>


<div id="kyc" class="section">

<div class="card">

<h2>KYC</h2>

<div style="overflow-x:auto">

<table>

<thead>

<tr>
<th>User</th>
<th>Status</th>
</tr>

</thead>

<tbody id="kycTable"></tbody>

</table>

</div>

</div>

</div>


<div id="settings" class="section">

<div class="card">

<h2>⚙️ Settings</h2>


<div class="setting">

<span>OTP Login</span>

<label class="switch">

<input id="otpLogin" type="checkbox">

<span class="slider"></span>

</label>

</div>


<div class="setting">

<span>Registration</span>

<label class="switch">

<input id="registration" type="checkbox">

<span class="slider"></span>

</label>

</div>


<div class="setting">

<span>Maintenance Mode</span>

<label class="switch">

<input id="maintenance" type="checkbox">

<span class="slider"></span>

</label>

</div>


<div class="setting">

<span>Minimum Deposit</span>

<input id="minDeposit" type="number">

</div>


<div class="setting">

<span>Maximum Deposit</span>

<input id="maxDeposit" type="number">

</div>


<div class="setting">

<span>Minimum Withdraw</span>

<input id="minWithdraw" type="number">

</div>


<div class="setting">

<span>Maximum Withdraw</span>

<input id="maxWithdraw" type="number">

</div>

<br>

<button type="button" onclick="saveSettings()">
💾 Save Settings
</button>

<div id="settingsStatus" class="status"></div>

</div>

</div>

</div>


<script>

const API =
"https://ludokingstar-ludokingstar-backend-2026.onrender.com";


function showSection(id){

document
.querySelectorAll(".section")
.forEach(s =>
s.classList.remove("active")
);

const el =
document.getElementById(id);

if(el){
el.classList.add("active");
}

if(id==="settings"){
loadSettings();
}

}


async function getJSON(url){

const r =
await fetch(url,{
cache:"no-store"
});

if(!r.ok){
throw new Error("HTTP "+r.status);
}

return r.json();

}


async function loadUsers(){

try{

const d =
await getJSON(API+"/api/users");

const a =
Array.isArray(d)
? d
: (d.users||[]);

document
.getElementById("userCount")
.textContent=a.length;

document
.getElementById("usersTable")
.innerHTML=

a.map(u=>`

<tr>

<td>${u.id??""}</td>

<td>${u.phone??""}</td>

<td>${u.verified?"Yes":"No"}</td>

</tr>

`).join("")

||

"<tr><td colspan='3'>No users</td></tr>";

}catch(e){

document
.getElementById("usersTable")
.innerHTML=
"<tr><td colspan='3'>Unable to load users</td></tr>";

}

}


async function loadTransactions(){

try{

const d =
await getJSON(API+"/api/transactions");

const a =
Array.isArray(d)
? d
: (d.transactions||[]);

document
.getElementById("transactionCount")
.textContent=a.length;

document
.getElementById("transactionsTable")
.innerHTML=

a.map(t=>`

<tr>
