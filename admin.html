<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LudoKingStar Admin</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}
header{
  background:#111827;
  color:white;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}
.container{
  padding:20px;
  max-width:1000px;
  margin:auto;
}
.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
button{
  border:0;
  padding:12px 18px;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#1d4ed8}
.page{display:none}
.page.active{display:block}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}
.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}
.card h3{
  margin:0 0 10px;
  font-size:16px;
  color:#555;
}
.number{
  font-size:30px;
  font-weight:bold;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  background:#ecfdf5;
  color:#047857;
}
pre{
  background:#111827;
  color:#fff;
  padding:15px;
  border-radius:8px;
  overflow:auto;
}
</style>
</head>

<body>

<header>🛡️ LudoKingStar Admin</header>

<div class="container">

<div class="buttons">
<button onclick="openPage('dashboard'); loadDashboard()">Dashboard</button>
<button onclick="openPage('users'); loadUsers()">Users</button>
<button onclick="openPage('transactions'); loadTransactions()">Transactions</button>
<button onclick="openPage('kyc'); loadKyc()">KYC</button>
<button onclick="openPage('settings'); loadSettings()">Settings</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page active">
<h2>Dashboard</h2>

<div class="cards">
<div class="card">
<h3>Total Users</h3>
<div class="number" id="totalUsers">-</div>
</div>

<div class="card">
<h3>Total Transactions</h3>
<div class="number" id="totalTransactions">-</div>
</div>

<div class="card">
<h3>KYC Records</h3>
<div class="number" id="totalKyc">-</div>
</div>

<div class="card">
<h3>Backend</h3>
<div class="number" id="backendStatus">...</div>
</div>
</div>

<div id="dashboardMessage" class="status">
Loading backend data...
</div>
</div>

<!-- USERS -->
<div id="users" class="page">
<h2>Users</h2>
<div id="usersData">Loading...</div>
</div>

<!-- TRANSACTIONS -->
<div id="transactions" class="page">
<h2>Transactions</h2>
<div id="transactionsData">Loading...</div>
</div>

<!-- KYC -->
<div id="kyc" class="page">
<h2>KYC</h2>
<div id="kycData">Loading...</div>
</div>

<!-- SETTINGS -->
<div id="settings" class="page">
<h2>Settings</h2>
<div id="settingsData">Loading...</div>
</div>

</div>

<script>

const API =
"https://ludokingstar-ludokingstar-backend-2026.onrender.com";

function openPage(page){
  document.querySelectorAll(".page").forEach(function(item){
    item.classList.remove("active");
  });

  document.getElementById(page).classList.add("active");
}

async function getData(url){
  const response = await fetch(API + url);

  if(!response.ok){
    throw new Error("Backend error");
  }

  return await response.json();
}

async function loadDashboard(){

  document.getElementById("dashboardMessage").innerText =
  "Loading backend data...";

  try{

    const users = await getData("/api/users");
    const transactions = await getData("/api/transactions");
    const kyc = await getData("/api/kyc");
    const health = await getData("/api/health");

    document.getElementById("totalUsers").innerText =
      Array.isArray(users) ? users.length : "-";

    document.getElementById("totalTransactions").innerText =
      Array.isArray(transactions) ? transactions.length : "-";

    document.getElementById("totalKyc").innerText =
      Array.isArray(kyc) ? kyc.length : "-";

    document.getElementById("backendStatus").innerText =
      health.ok ? "LIVE" : "OFF";

    document.getElementById("dashboardMessage").innerText =
      "✅ Dashboard connected to backend";

  }catch(error){

    document.getElementById("backendStatus").innerText =
      "ERROR";

    document.getElementById("dashboardMessage").innerText =
      "❌ Backend data load failed";

  }
}

async function loadUsers(){

  const box = document.getElementById("usersData");

  try{

    const data = await getData("/api/users");

    box.innerHTML =
      "<pre>" +
      JSON.stringify(data,null,2) +
      "</pre>";

  }catch(error){

    box.innerHTML =
      "<div class='status'>❌ Users load failed</div>";

  }
}

async function loadTransactions(){

  const box = document.getElementById("transactionsData");

  try{

    const data = await getData("/api/transactions");

    box.innerHTML =
      "<pre>" +
      JSON.stringify(data,null,2) +
      "</pre>";

  }catch(error){

    box.innerHTML =
      "<div class='status'>❌ Transactions load failed</div>";

  }
}

async function loadKyc(){

  const box = document.getElementById("kycData");

  try{

    const data = await getData("/api/kyc");

    box.innerHTML =
      "<pre>" +
      JSON.stringify(data,null,2) +
      "</pre>";

  }catch(error){

    box.innerHTML =
      "<div class='status'>❌ KYC load failed</div>";

  }
}

async function loadSettings(){

  const box = document.getElementById("settingsData");

  try{

    const data = await getData("/api/settings");

    box.innerHTML =
      "<pre>" +
      JSON.stringify(data,null,2) +
      "</pre>";

  }catch(error){

    box.innerHTML =
      "<div class='status'>❌ Settings load failed</div>";

  }
}

loadDashboard();

</script>

</body>
</html>
