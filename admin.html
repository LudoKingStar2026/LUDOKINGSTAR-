<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LudoKingStar Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}
.card{
  background:white;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #0001;
}
h2{margin-top:0}
button{
  border:0;
  padding:11px 16px;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:.9}
nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}
nav button{background:#374151}
table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
}
th,td{
  padding:10px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
}
th{background:#f9fafb}
.setting{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #eee;
  gap:15px;
}
input[type="number"]{
  width:150px;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:7px;
}
.switch{
  position:relative;
  width:52px;
  height:28px;
}
.switch input{display:none}
.slider{
  position:absolute;
  inset:0;
  background:#9ca3af;
  border-radius:30px;
  cursor:pointer;
}
.slider:before{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  left:3px;
  top:3px;
  background:white;
  border-radius:50%;
  transition:.2s;
}
.switch input:checked + .slider{
  background:#16a34a;
}
.switch input:checked + .slider:before{
  transform:translateX(24px);
}
.section{display:none}
.section.active{display:block}
.status{
  margin-top:10px;
  font-weight:bold;
}
@media(max-width:600px){
  th,td{font-size:12px;padding:7px}
  .setting{align-items:flex-start}
}
</style>
</head>

<body>

<header>🛡️ LudoKingStar Admin</header>

<div class="container">

<nav>
  <button onclick="showSection('dashboard')">Dashboard</button>
  <button onclick="showSection('users')">Users</button>
  <button onclick="showSection('transactions')">Transactions</button>
  <button onclick="showSection('kyc')">KYC</button>
  <button onclick="showSection('settings')">Settings</button>
  <button onclick="loadAll()">🔄 Refresh</button>
</nav>

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
  <div class="card">
    <h2>Dashboard</h2>
    <p>Total Users: <b id="userCount">0</b></p>
    <p>Total Transactions: <b id="transactionCount">0</b></p>
    <p>KYC Records: <b id="kycCount">0</b></p>
  </div>
</div>

<!-- USERS -->
<div id="users" class="section">
  <div class="card">
    <h2>Users</h2>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Phone</th>
            <th>Verified</th>
          </tr>
        </thead>
        <tbody id="usersTable"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- TRANSACTIONS -->
<div id="transactions" class="section">
  <div class="card">
    <h2>Transactions</h2>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>User</th>
            <th>Type</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="transactionsTable"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- KYC -->
<div id="kyc" class="section">
  <div class="card">
    <h2>KYC</h2>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="kycTable"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings" class="section">

  <div class="card">
    <h2>⚙️ Settings</h2>

    <div class="setting">
      <span>OTP Login</span>
      <label class="switch">
        <input type="checkbox" id="otpLogin">
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting">
      <span>Registration</span>
      <label class="switch">
        <input type="checkbox" id="registration">
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting">
      <span>Maintenance Mode</span>
      <label class="switch">
        <input type="checkbox" id="maintenance">
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting">
      <span>Minimum Deposit</span>
      <input type="number" id="minDeposit">
    </div>

    <div class="setting">
      <span>Maximum Deposit</span>
      <input type="number" id="maxDeposit">
    </div>

    <div class="setting">
      <span>Minimum Withdraw</span>
      <input type="number" id="minWithdraw">
    </div>

    <div class="setting">
      <span>Maximum Withdraw</span>
      <input type="number" id="maxWithdraw">
    </div>

    <br>

    <button onclick="saveSettings()">💾 Save Settings</button>

    <div id="settingsStatus" class="status"></div>
  </div>

</div>

</div>

<script>

const API =
"https://ludokingstar-ludokingstar-backend-2026.onrender.com";

function showSection(id){
  document.querySelectorAll(".section")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  if(id==="settings") loadSettings();
}

async function loadUsers(){
  try{
    const r=await fetch(API+"/api/users");
    const data=await r.json();

    const users=Array.isArray(data)?data:(data.users||[]);

    document.getElementById("userCount").textContent=users.length;

    document.getElementById("usersTable").innerHTML=
      users.map(u=>`
        <tr>
          <td>${u.id ?? ""}</td>
          <td>${u.phone ?? ""}</td>
          <td>${u.verified ? "Yes":"No"}</td>
        </tr>
      `).join("");
  }catch(e){
    console.log(e);
  }
}

async function loadTransactions(){
  try{
    const r=await fetch(API+"/api/transactions");
    const data=await r.json();

    const list=Array.isArray(data)?data:(data.transactions||[]);

    document.getElementById("transactionCount").textContent=list.length;

    document.getElementById("transactionsTable").innerHTML=
      list.map(t=>`
        <tr>
          <td>${t.id ?? ""}</td>
          <td>${t.userId ?? t.user ?? ""}</td>
          <td>${t.type ?? ""}</td>
          <td>${t.amount ?? ""}</td>
        </tr>
      `).join("");
  }catch(e){
    console.log(e);
  }
}

async function loadKyc(){
  try{
    const r=await fetch(API+"/api/kyc");
    const data=await r.json();

    const list=Array.isArray(data)?data:(data.kyc||[]);

    document.getElementById("kycCount").textContent=list.length;

    document.getElementById("kycTable").innerHTML=
      list.map(k=>`
        <tr>
          <td>${k.userId ?? k.user ?? ""}</td>
          <td>${k.status ?? ""}</td>
        </tr>
      `).join("");
  }catch(e){
    console.log(e);
  }
}

async function loadSettings(){
  try{
    const r=await fetch(API+"/api/settings");
    const s=await r.json();

    document.getElementById("otpLogin").checked =
      !!s.otpLogin;

    document.getElementById("registration").checked =
      !!s.registration;

    document.getElementById("maintenance").checked =
      !!s.maintenance;

    document.getElementById("minDeposit").value =
      s.minDeposit ?? 10;

    document.getElementById("maxDeposit").value =
      s.maxDeposit ?? 10000;

    document.getElementById("minWithdraw").value =
      s.minWithdraw ?? 100;

    document.getElementById("maxWithdraw").value =
      s.maxWithdraw ?? 10000;

  }catch(e){
    document.getElementById("settingsStatus").textContent =
      "❌ Settings load failed";
  }
}

async function saveSettings(){

  const settings={
    otpLogin:document.getElementById("otpLogin").checked,
    registration:document.getElementById("registration").checked,
    maintenance:document.getElementById("maintenance").checked,
    minDeposit:Number(document.getElementById("minDeposit").value),
    maxDeposit:Number(document.getElementById("maxDeposit").value),
    minWithdraw:Number(document.getElementById("minWithdraw").value),
    maxWithdraw:Number(document.getElementById("maxWithdraw").value)
  };

  const status=document.getElementById("settingsStatus");

  try{

    const r=await fetch(API+"/api/admin/settings",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(settings)
    });

    const data=await r.json();

    if(!r.ok){
      status.textContent="❌ "+(data.error||"Save failed");
      return;
    }

    status.textContent="✅ Settings
